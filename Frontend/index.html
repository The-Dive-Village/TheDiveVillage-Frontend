<body style="background-color: #001e3d; margin: 0; padding: 0;">
  <!-- Global Ambient Audio Stream (Loaded and playing from millisecond zero) -->
  <audio
    id="tdv-global-ambient-audio"
    src="https://pub-4163c0b42ded4a0a9b4f34a1460da643.r2.dev/TDV-Media/Audio/Audio.mp3"
    autoplay
    loop
    preload="auto"
    crossorigin="anonymous"
    playsinline
    webkit-playsinline
    style="display:none;position:fixed;pointer-events:none;"
  ></audio>
  <script>
    (function () {
      try {
        var audio = document.getElementById('tdv-global-ambient-audio');
        if (!audio) return;
        var isMuted = localStorage.getItem('tdv_audio_muted') === 'true';
        if (isMuted) {
          audio.muted = true;
          audio.volume = 0;
          return;
        }

        audio.volume = 0.5;

        var startPlay = function () {
          if (localStorage.getItem('tdv_audio_muted') === 'true') return;
          if (document.hidden) return;
          audio.muted = false;
          audio.volume = 0.5;
          var p = audio.play();
          if (p !== undefined) {
            p.then(function () {
              audio.muted = false;
              audio.volume = 0.5;
              if ('mediaSession' in navigator && typeof MediaMetadata !== 'undefined') {
                try {
                  navigator.mediaSession.metadata = new MediaMetadata({
                    title: 'Underwater Ambiance',
                    artist: 'The Dive Village',
                    album: "It's a Community",
                    artwork: [{ src: 'https://pub-4163c0b42ded4a0a9b4f34a1460da643.r2.dev/TDV-Media/UI/Logo.png', sizes: '512x512', type: 'image/png' }]
                  });
                } catch (e) {}
              }
            }).catch(function () {
              // If unmuted autoplay blocked on initial boot, play muted so stream runs
              audio.muted = true;
              audio.play().catch(function () {});
            });
          }
        };

        startPlay();
        document.addEventListener('DOMContentLoaded', startPlay, { once: true });
        window.addEventListener('load', startPlay, { once: true });

        // Unmute on first user interaction gesture
        var unlockEvents = ['pointerdown', 'touchstart', 'click'];
        var onUserGesture = function () {
          if (localStorage.getItem('tdv_audio_muted') === 'true') return;
          if (document.hidden) return;
          if (audio.muted || audio.paused) {
            audio.muted = false;
            audio.volume = 0.5;
            var p = audio.play();
            if (p !== undefined) {
              p.then(function () {
                audio.muted = false;
                audio.volume = 0.5;
                if ('mediaSession' in navigator && typeof MediaMetadata !== 'undefined') {
                  try {
                    navigator.mediaSession.metadata = new MediaMetadata({
                      title: 'Underwater Ambiance',
                      artist: 'The Dive Village',
                      album: "It's a Community",
                      artwork: [{ src: 'https://pub-4163c0b42ded4a0a9b4f34a1460da643.r2.dev/TDV-Media/UI/Logo.png', sizes: '512x512', type: 'image/png' }]
                    });
                  } catch (e) {}
                }
              }).catch(function () {});
            }
          }
        };
        unlockEvents.forEach(function (e) {
          window.addEventListener(e, onUserGesture, { once: true, passive: true });
        });
      } catch (e) {}
    })();
  </script>

</body>
